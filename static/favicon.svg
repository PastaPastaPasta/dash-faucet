<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4ff"/>
      <stop offset="50%" style="stop-color:#008de4"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Water droplet - fills more space -->
  <path d="M16 0 C16 0 2 15 2 22 C2 27.5 8.3 32 16 32 C23.7 32 30 27.5 30 22 C30 15 16 0 16 0 Z" fill="url(#dropGradient)"/>
  <!-- Shine -->
  <ellipse cx="10" cy="19" rx="4" ry="5" fill="url(#shineGradient)"/>
</svg>
